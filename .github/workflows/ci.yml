name: EfesOS CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain and emulator
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y clang lld llvm nasm qemu-system-x86 make python3
      - name: Build and verify image
        run: make verify
      - name: SHA-256 integrity negative test
        run: make sha256-self-test
      - name: SHA-256 boot rejection test
        run: make sha256-boot-negative-test
      - name: Release signature verification
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out build/ci-release-key.pem 2>/dev/null
          openssl rsa -in build/ci-release-key.pem -pubout -out build/ci-release-key.pub.pem 2>/dev/null
          openssl dgst -sha256 -sign build/ci-release-key.pem -out build/ci-release.sig build/efesos.img
          openssl dgst -sha256 -verify build/ci-release-key.pub.pem -signature build/ci-release.sig build/efesos.img
          cp build/efesos.img build/ci-release-mutated.img
          printf '\001' | dd of=build/ci-release-mutated.img bs=1 seek=4096 conv=notrunc status=none
          if openssl dgst -sha256 -verify build/ci-release-key.pub.pem -signature build/ci-release.sig build/ci-release-mutated.img; then exit 1; fi
      - name: Static analyzer
        run: |
          fixed_address_args=()
          if clang --analyze -x c /dev/null -Xanalyzer -analyzer-checker-help 2>&1 | grep -q 'core.FixedAddressDereference'; then
            fixed_address_args=(-Xanalyzer -analyzer-disable-checker=core.FixedAddressDereference)
          fi
          clang --target=i686-none-elf -m32 -std=c11 -ffreestanding -fno-builtin -fno-pic -fno-pie -fno-stack-protector -nostdlib \
            -Iinclude -Icpu -Ikernel -Imemory -Iprocess -Ishell -Ifs -Igames \
            --analyze -Xanalyzer -analyzer-output=text \
            "${fixed_address_args[@]}" \
            $(find . -name '*.c' -not -path './tests/*' -not -path './build/*' -print)
      - name: Reproducible image build
        run: |
          sha256sum build/efesos.img > /tmp/efesos-first.sha256
          make clean
          make verify
          sha256sum build/efesos.img > /tmp/efesos-second.sha256
          cmp /tmp/efesos-first.sha256 /tmp/efesos-second.sha256
      - name: Block device host test
        run: clang -std=c11 -Wall -Wextra -Werror -Iinclude tests/block_device_host_test.c drivers/block_device.c -o build/block-device-host-test && build/block-device-host-test
      - name: ATA IRQ state host test
        run: clang -std=c11 -Wall -Wextra -Werror -Idrivers tests/ata_irq_state_host_test.c drivers/ata_irq_state.c -o build/ata-irq-state-host-test && build/ata-irq-state-host-test
      - name: ATA DMA contract host test
        run: clang -std=c11 -Wall -Wextra -Werror -Iinclude -Idrivers tests/ata_dma_host_test.c drivers/ata_dma.c -o build/ata-dma-host-test && build/ata-dma-host-test
      - name: PCI AHCI layout host test
        run: clang -std=c11 -Wall -Wextra -Werror -Iinclude tests/pci_ahci_host_test.c drivers/pci_layout.c -o build/pci-ahci-host-test && build/pci-ahci-host-test
      - name: AHCI command layout host test
        run: clang -std=c11 -Wall -Wextra -Werror -Iinclude -Idrivers tests/ahci_layout_host_test.c drivers/ahci_layout.c -o build/ahci-layout-host-test && build/ahci-layout-host-test
      - name: RTC conversion host test
        run: clang -std=c11 -Wall -Wextra -Werror -Iinclude -Idrivers tests/rtc_host_test.c drivers/rtc_time.c -o build/rtc-host-test && build/rtc-host-test
      - name: ACPI table host test
        run: clang -std=c11 -Wall -Wextra -Werror -Idrivers tests/acpi_host_test.c drivers/acpi_tables.c -o build/acpi-host-test && build/acpi-host-test
      - name: ACPI MADT host test
        run: clang -std=c11 -Wall -Wextra -Werror -Idrivers tests/madt_host_test.c drivers/acpi_tables.c -o build/madt-host-test && build/madt-host-test
      - name: HPET time conversion host test
        run: clang -std=c11 -Wall -Wextra -Werror -Idrivers tests/hpet_host_test.c drivers/hpet_time.c -o build/hpet-host-test && build/hpet-host-test
      - name: FAT parser host test
        run: clang -std=c11 -Wall -Wextra -Werror -Ifs tests/fat_host_test.c fs/fat.c -o build/fat-host-test && build/fat-host-test
      - name: Boot metadata host test
        run: clang -std=c11 -Wall -Wextra -Werror -Iinclude tests/boot_info_host_test.c -o build/boot-info-host-test && build/boot-info-host-test
      - name: E820 normalization host test
        run: clang -std=c11 -Wall -Wextra -Werror -Iinclude -Imemory tests/e820_host_test.c memory/e820.c -o build/e820-host-test && build/e820-host-test
      - name: ELF loader host test
        run: clang -std=c11 -Wall -Wextra -Werror -Iprocess -Imemory -Ikernel -Iinclude tests/elf_host_test.c process/elf_loader.c -o build/elf-host-test && build/elf-host-test
      - name: RAMFS host test
        run: clang -std=c11 -Wall -Wextra -Werror -Ifs tests/ramfs_host_test.c fs/ramfs.c -o build/ramfs-host-test && build/ramfs-host-test
      - name: Journal host test
        run: clang -std=c11 -Wall -Wextra -Werror -Ifs tests/journal_host_test.c fs/journal.c -o build/journal-host-test && build/journal-host-test
      - name: Persistent RAMFS host test
        run: clang -std=c11 -Wall -Wextra -Werror -Iinclude -Ifs -Ikernel -Imemory tests/persistent_host_test.c fs/persistent.c fs/journal.c fs/ramfs.c -o build/persistent-host-test && build/persistent-host-test
      - name: Sanitized parser, filesystem and ELF host tests
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -Iinclude tests/boot_info_host_test.c -o build/boot-info-host-sanitize
          build/boot-info-host-sanitize
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -Iinclude -Imemory tests/e820_host_test.c memory/e820.c -o build/e820-host-sanitize
          build/e820-host-sanitize
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -Iinclude tests/block_device_host_test.c drivers/block_device.c -o build/block-device-host-sanitize
          build/block-device-host-sanitize
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -Idrivers tests/ata_irq_state_host_test.c drivers/ata_irq_state.c -o build/ata-irq-state-host-sanitize
          build/ata-irq-state-host-sanitize
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -Iinclude -Idrivers tests/ata_dma_host_test.c drivers/ata_dma.c -o build/ata-dma-host-sanitize
          build/ata-dma-host-sanitize
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -Iinclude -Idrivers tests/ahci_layout_host_test.c drivers/ahci_layout.c -o build/ahci-layout-host-sanitize
          build/ahci-layout-host-sanitize
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -Iinclude -Idrivers tests/rtc_host_test.c drivers/rtc_time.c -o build/rtc-host-sanitize
          build/rtc-host-sanitize
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -Idrivers tests/acpi_host_test.c drivers/acpi_tables.c -o build/acpi-host-sanitize
          build/acpi-host-sanitize
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -Idrivers tests/madt_host_test.c drivers/acpi_tables.c -o build/madt-host-sanitize
          build/madt-host-sanitize
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -Idrivers tests/hpet_host_test.c drivers/hpet_time.c -o build/hpet-host-sanitize
          build/hpet-host-sanitize
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -Ifs tests/fat_host_test.c fs/fat.c -o build/fat-host-sanitize
          build/fat-host-sanitize
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -Iprocess -Imemory -Ikernel -Iinclude tests/elf_host_test.c process/elf_loader.c -o build/elf-host-sanitize
          build/elf-host-sanitize
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -Ifs tests/ramfs_host_test.c fs/ramfs.c -o build/ramfs-host-sanitize
          build/ramfs-host-sanitize
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -Ifs tests/journal_host_test.c fs/journal.c -o build/journal-host-sanitize
          build/journal-host-sanitize
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -Iinclude -Ifs -Ikernel -Imemory tests/persistent_host_test.c fs/persistent.c fs/journal.c fs/ramfs.c -o build/persistent-host-sanitize
          build/persistent-host-sanitize
      - name: QEMU boot smoke test
        run: |
          timeout 20s qemu-system-i386 -display none -monitor none -serial stdio -no-reboot -no-shutdown -m 128 -drive file=build/efesos.img,format=raw,if=floppy -boot a > build/ci-serial.log 2> build/ci-qemu-error.log || true
          grep -F "EfesOS: kernel entry reached." build/ci-serial.log
          grep -F "EfesOS: CPU features cpuid=" build/ci-serial.log
          grep -F "EfesOS: BIOS E820 entries available." build/ci-serial.log
          grep -F "EfesOS: ELF loader runtime self-test passed." build/ci-serial.log
          grep -F "EfesOS: stage-2 kernel integrity check passed." build/ci-serial.log
          grep -F "EfesOS: RTC calendar self-test passed." build/ci-serial.log
          grep -F "EfesOS: RTC stable read passed year=" build/ci-serial.log
          grep -F "EfesOS: PCI devices discovered=" build/ci-serial.log
          grep -F "EfesOS: AHCI controllers discovered=" build/ci-serial.log
          grep -F "EfesOS: ATA primary-master present=" build/ci-serial.log
          grep -F "EfesOS: ATA IRQ mode enabled=" build/ci-serial.log
          grep -F "EfesOS: ATA DMA mode enabled=" build/ci-serial.log
          grep -F "EfesOS: ATA write path fail-closed self-test passed." build/ci-serial.log
          grep -F "EfesOS: block device abstraction passed." build/ci-serial.log
          grep -F "EfesOS: FAT volume mounted=" build/ci-serial.log
          grep -F "EfesOS: syscall ABI self-test passed." build/ci-serial.log
          grep -F "EfesOS: interrupt self-tests passed." build/ci-serial.log
          grep -F "EfesOS: VMM self-test passed." build/ci-serial.log
          grep -F "EfesOS: ACPI root table validated." build/ci-serial.log
          grep -F "EfesOS: ACPI MADT validated lapic=0xFEE00000" build/ci-serial.log
          grep -F "EfesOS: APIC interrupt routing enabled lapic-id=" build/ci-serial.log
          grep -F "EfesOS: ELF loader validation self-test passed." build/ci-serial.log
          grep -F "EfesOS: kernel heap self-test passed." build/ci-serial.log
          grep -F "EfesOS: RAM filesystem self-test passed." build/ci-serial.log
          grep -F "EfesOS: journal record self-test passed." build/ci-serial.log
          grep -F "EfesOS: bounded IPC queue self-test passed." build/ci-serial.log
          grep -F "EfesOS: user stack guard self-test passed." build/ci-serial.log
          grep -F "EfesOS: user address-space isolation self-test passed." build/ci-serial.log
          grep -F "EfesOS: scheduler priority self-test passed." build/ci-serial.log
          grep -F "EfesOS: ring3 syscall runtime test passed." build/ci-serial.log
          grep -F "EfesOS: user pointer validation runtime test passed." build/ci-serial.log
          grep -F "EfesOS: user process resource cleanup passed." build/ci-serial.log
          grep -F "EfesOS: user process restart and slot reuse passed." build/ci-serial.log
          grep -F "EfesOS: repeated user process cleanup passed." build/ci-serial.log
          grep -F "EfesOS: repeated user restart stress passed." build/ci-serial.log
          grep -F "EfesOS: user address-space switch runtime test passed." build/ci-serial.log
          grep -F "EfesOS: multiple user process isolation self-test passed." build/ci-serial.log
          grep -F "EfesOS: user IPC syscall runtime test passed." build/ci-serial.log
          grep -F "EfesOS: invalid user IPC pointer rejected." build/ci-serial.log
          grep -F "EfesOS: targeted user IPC runtime test passed." build/ci-serial.log
          grep -F "EfesOS: blocking user IPC runtime test passed." build/ci-serial.log
          grep -F "EfesOS: user exit lifecycle runtime test passed." build/ci-serial.log
          grep -F "EfesOS: generation-based user PID runtime test passed." build/ci-serial.log
          grep -F "EfesOS: scheduler stack resource cleanup passed." build/ci-serial.log
          grep -F "EfesOS: scheduler block/wake lifecycle self-test passed." build/ci-serial.log
          grep -F "EfesOS: user exception isolated." build/ci-serial.log
          grep -F "EfesOS: preemptive scheduler runtime test passed." build/ci-serial.log
          grep -F "EfesOS: scheduler timer active=" build/ci-serial.log
          if grep -F "KERNEL PANIC:" build/ci-serial.log; then exit 1; fi
      - name: QEMU deterministic RTC smoke test
        run: |
          timeout 20s qemu-system-i386 -display none -monitor none -serial file:build/ci-rtc-serial.log -no-reboot -no-shutdown -m 128 -rtc base=2024-02-29T23:58:00,clock=vm -drive file=build/efesos.img,format=raw,if=floppy -boot a || true
          grep -F "EfesOS: RTC calendar self-test passed." build/ci-rtc-serial.log
          grep -F "EfesOS: RTC stable read passed year=0x000007E8 month=0x00000002 day=0x0000001D hour=0x00000017 minute=0x0000003A" build/ci-rtc-serial.log
          if grep -F "KERNEL PANIC:" build/ci-rtc-serial.log; then exit 1; fi
      - name: QEMU ACPI HPET discovery smoke test
        run: |
          timeout 20s qemu-system-i386 -machine pc,hpet=on -display none -monitor none -serial file:build/ci-hpet-serial.log -no-reboot -no-shutdown -m 128 -drive file=build/efesos.img,format=raw,if=floppy -boot a || true
          grep -F "EfesOS: ACPI root table validated." build/ci-hpet-serial.log
          grep -F "EfesOS: ACPI MADT validated lapic=0xFEE00000" build/ci-hpet-serial.log
          grep -F "EfesOS: ACPI HPET table validated base=0xFED00000" build/ci-hpet-serial.log
          grep -F "EfesOS: HPET monotonic counter self-test passed period-fs=" build/ci-hpet-serial.log
          grep -F "EfesOS: scheduler timer active=local-apic initial-count=" build/ci-hpet-serial.log
          if grep -F "KERNEL PANIC:" build/ci-hpet-serial.log; then exit 1; fi
      - name: QEMU Q35 ICH9 platform smoke test
        run: |
          timeout 20s qemu-system-i386 -machine q35,hpet=on -display none -monitor none -serial file:build/ci-q35-serial.log -no-reboot -no-shutdown -m 128 -drive file=build/efesos.img,format=raw,if=floppy -boot a || true
          grep -F "EfesOS: PCI devices discovered=" build/ci-q35-serial.log
          grep -F "EfesOS: AHCI controllers discovered=0x00000001 usable-mmio=0x00000001." build/ci-q35-serial.log
          grep -F "EfesOS: ACPI root table validated." build/ci-q35-serial.log
          grep -F "EfesOS: ACPI MADT validated lapic=0xFEE00000" build/ci-q35-serial.log
          grep -F "EfesOS: APIC interrupt routing enabled lapic-id=" build/ci-q35-serial.log
          grep -F "EfesOS: ACPI HPET table validated base=0xFED00000" build/ci-q35-serial.log
          grep -F "EfesOS: scheduler timer active=local-apic initial-count=" build/ci-q35-serial.log
          grep -F "EfesOS: repeated user restart stress passed." build/ci-q35-serial.log
          grep -F "EfesOS: preemptive scheduler runtime test passed." build/ci-q35-serial.log
          if grep -F "KERNEL PANIC:" build/ci-q35-serial.log; then exit 1; fi
      - name: QEMU ACPI absence fallback smoke test
        run: |
          timeout 20s qemu-system-i386 -machine pc,acpi=off -display none -monitor none -serial file:build/ci-no-acpi-serial.log -no-reboot -no-shutdown -m 128 -drive file=build/efesos.img,format=raw,if=floppy -boot a || true
          grep -F "EfesOS: ACPI root table unavailable or invalid." build/ci-no-acpi-serial.log
          grep -F "EfesOS: APIC routing unavailable; dual 8259 PIC fallback active." build/ci-no-acpi-serial.log
          grep -F "EfesOS: scheduler timer active=pit." build/ci-no-acpi-serial.log
          grep -F "EfesOS: ELF loader runtime self-test passed." build/ci-no-acpi-serial.log
          if grep -F "KERNEL PANIC:" build/ci-no-acpi-serial.log; then exit 1; fi
      - name: QEMU local APIC timer fallback smoke test
        run: |
          timeout 20s qemu-system-i386 -machine pc,hpet=off -display none -monitor none -serial file:build/ci-no-hpet-serial.log -no-reboot -no-shutdown -m 128 -drive file=build/efesos.img,format=raw,if=floppy -boot a || true
          grep -F "EfesOS: APIC interrupt routing enabled lapic-id=" build/ci-no-hpet-serial.log
          grep -F "EfesOS: ACPI HPET table unavailable." build/ci-no-hpet-serial.log
          grep -F "EfesOS: scheduler timer active=pit." build/ci-no-hpet-serial.log
          grep -F "EfesOS: repeated user restart stress passed." build/ci-no-hpet-serial.log
          if grep -F "KERNEL PANIC:" build/ci-no-hpet-serial.log; then exit 1; fi
      - name: QEMU APIC capability fallback smoke test
        run: |
          timeout 20s qemu-system-i386 -cpu qemu32,apic=off -display none -monitor none -serial file:build/ci-no-apic-serial.log -no-reboot -no-shutdown -m 128 -drive file=build/efesos.img,format=raw,if=floppy -boot a || true
          grep -F "EfesOS: ACPI MADT validated lapic=0xFEE00000" build/ci-no-apic-serial.log
          grep -F "EfesOS: APIC routing unavailable; dual 8259 PIC fallback active." build/ci-no-apic-serial.log
          grep -F "EfesOS: scheduler timer active=pit." build/ci-no-apic-serial.log
          grep -F "EfesOS: preemptive scheduler runtime test passed." build/ci-no-apic-serial.log
          if grep -F "KERNEL PANIC:" build/ci-no-apic-serial.log; then exit 1; fi
      - name: QEMU ATA IRQ14 smoke test
        run: |
          truncate -s 4M build/ci-ata.img
          timeout 20s qemu-system-i386 -display none -monitor none -serial file:build/ci-ata-irq-serial.log -no-reboot -no-shutdown -m 128 -drive file=build/efesos.img,format=raw,if=floppy -boot a -drive file=build/ci-ata.img,format=raw,if=ide || true
          grep -F "EfesOS: ATA IRQ completion self-test passed." build/ci-ata-irq-serial.log
          grep -F "EfesOS: ATA IRQ mode enabled=0x00000001" build/ci-ata-irq-serial.log
          grep -F "polling-fallbacks=0x00000000." build/ci-ata-irq-serial.log
          grep -F "EfesOS: ATA DMA mode enabled=0x00000001" build/ci-ata-irq-serial.log
          grep -F "EfesOS: ATA DMA/PIO data integrity self-test passed." build/ci-ata-irq-serial.log
          grep -F "transfers=0x00000001 fallbacks=0x00000000." build/ci-ata-irq-serial.log
          grep -F "EfesOS: APIC interrupt routing enabled lapic-id=" build/ci-ata-irq-serial.log
          grep -F "EfesOS: repeated user restart stress passed." build/ci-ata-irq-serial.log
          if grep -F "KERNEL PANIC:" build/ci-ata-irq-serial.log; then exit 1; fi
      - name: QEMU PAE and NX smoke test
        run: |
          timeout 20s qemu-system-i386 -cpu qemu64 -display none -monitor none -serial file:build/ci-nx-serial.log -no-reboot -no-shutdown -m 128 -drive file=build/efesos.img,format=raw,if=floppy -boot a || true
          grep -F "EfesOS: paging mode=PAE hardware-nx=0x00000001." build/ci-nx-serial.log
          grep -F "EfesOS: ELF loader runtime self-test passed." build/ci-nx-serial.log
          if grep -F "KERNEL PANIC:" build/ci-nx-serial.log; then exit 1; fi
      - name: QEMU hardware entropy smoke test
        run: |
          timeout 20s qemu-system-i386 -cpu max -display none -monitor none -serial file:build/ci-rdrand-serial.log -no-reboot -no-shutdown -m 128 -drive file=build/efesos.img,format=raw,if=floppy -boot a || true
          grep -F "rdrand=0x00000001" build/ci-rdrand-serial.log
          grep -F "EfesOS: paging mode=PAE hardware-nx=0x00000001." build/ci-rdrand-serial.log
          grep -F "EfesOS: ELF loader runtime self-test passed." build/ci-rdrand-serial.log
          if grep -F "KERNEL PANIC:" build/ci-rdrand-serial.log; then exit 1; fi
      - name: QEMU legacy paging fallback smoke test
        run: |
          timeout 20s qemu-system-i386 -machine pc,hpet=on -cpu qemu32,pae=off -display none -monitor none -serial file:build/ci-legacy-serial.log -no-reboot -no-shutdown -m 128 -drive file=build/efesos.img,format=raw,if=floppy -boot a || true
          grep -F "EfesOS: paging mode=legacy hardware-nx=0x00000000." build/ci-legacy-serial.log
          grep -F "EfesOS: APIC interrupt routing enabled lapic-id=" build/ci-legacy-serial.log
          grep -F "EfesOS: scheduler timer active=local-apic initial-count=" build/ci-legacy-serial.log
          grep -F "EfesOS: ELF loader runtime self-test passed." build/ci-legacy-serial.log
          grep -F "EfesOS: repeated user restart stress passed." build/ci-legacy-serial.log
          if grep -F "KERNEL PANIC:" build/ci-legacy-serial.log; then exit 1; fi

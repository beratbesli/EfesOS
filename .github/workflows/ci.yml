name: EfesOS CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install toolchain and emulator
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y clang lld nasm qemu-system-x86 make python3
      - name: Build and verify image
        run: make verify
      - name: Reproducible image build
        run: |
          sha256sum build/efesos.img > /tmp/efesos-first.sha256
          make clean
          make verify
          sha256sum build/efesos.img > /tmp/efesos-second.sha256
          cmp /tmp/efesos-first.sha256 /tmp/efesos-second.sha256
      - name: FAT parser host test
        run: clang -std=c11 -Wall -Wextra -Werror -Ifs tests/fat_host_test.c fs/fat.c -o build/fat-host-test && build/fat-host-test
      - name: Boot metadata host test
        run: clang -std=c11 -Wall -Wextra -Werror -Iinclude tests/boot_info_host_test.c -o build/boot-info-host-test && build/boot-info-host-test
      - name: ELF loader host test
        run: clang -std=c11 -Wall -Wextra -Werror -Iprocess -Imemory -Ikernel -Iinclude tests/elf_host_test.c process/elf_loader.c -o build/elf-host-test && build/elf-host-test
      - name: Sanitized FAT and ELF host tests
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -Ifs tests/fat_host_test.c fs/fat.c -o build/fat-host-sanitize
          build/fat-host-sanitize
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -Iprocess -Imemory -Ikernel -Iinclude tests/elf_host_test.c process/elf_loader.c -o build/elf-host-sanitize
          build/elf-host-sanitize
      - name: QEMU boot smoke test
        run: |
          timeout 20s qemu-system-i386 -display none -monitor none -serial stdio -no-reboot -no-shutdown -m 128 -drive file=build/efesos.img,format=raw,if=floppy -boot a > build/ci-serial.log 2> build/ci-qemu-error.log || true
          grep -F "EfesOS: kernel entry reached." build/ci-serial.log
          grep -F "EfesOS: BIOS E820 entries available." build/ci-serial.log
          grep -F "EfesOS: ELF loader runtime self-test passed." build/ci-serial.log
          grep -F "EfesOS: stage-2 kernel integrity check passed." build/ci-serial.log
          grep -F "EfesOS: PCI devices discovered=" build/ci-serial.log
          grep -F "EfesOS: ATA primary-master present=" build/ci-serial.log
          grep -F "EfesOS: ATA write path fail-closed self-test passed." build/ci-serial.log
          grep -F "EfesOS: FAT volume mounted=" build/ci-serial.log
          grep -F "EfesOS: syscall ABI self-test passed." build/ci-serial.log
          grep -F "EfesOS: interrupt self-tests passed." build/ci-serial.log
          grep -F "EfesOS: VMM self-test passed." build/ci-serial.log
          grep -F "EfesOS: ELF loader validation self-test passed." build/ci-serial.log
          grep -F "EfesOS: kernel heap self-test passed." build/ci-serial.log
          grep -F "EfesOS: RAM filesystem self-test passed." build/ci-serial.log
          grep -F "EfesOS: bounded IPC queue self-test passed." build/ci-serial.log
          grep -F "EfesOS: user stack guard self-test passed." build/ci-serial.log
          grep -F "EfesOS: user address-space isolation self-test passed." build/ci-serial.log
          grep -F "EfesOS: scheduler priority self-test passed." build/ci-serial.log
          grep -F "EfesOS: ring3 syscall runtime test passed." build/ci-serial.log
          grep -F "EfesOS: user pointer validation runtime test passed." build/ci-serial.log
          grep -F "EfesOS: user process resource cleanup passed." build/ci-serial.log
          grep -F "EfesOS: user process restart and slot reuse passed." build/ci-serial.log
          grep -F "EfesOS: repeated user process cleanup passed." build/ci-serial.log
          grep -F "EfesOS: repeated user restart stress passed." build/ci-serial.log
          grep -F "EfesOS: user address-space switch runtime test passed." build/ci-serial.log
          grep -F "EfesOS: multiple user process isolation self-test passed." build/ci-serial.log
          grep -F "EfesOS: user IPC syscall runtime test passed." build/ci-serial.log
          grep -F "EfesOS: invalid user IPC pointer rejected." build/ci-serial.log
          grep -F "EfesOS: targeted user IPC runtime test passed." build/ci-serial.log
          grep -F "EfesOS: blocking user IPC runtime test passed." build/ci-serial.log
          grep -F "EfesOS: user exit lifecycle runtime test passed." build/ci-serial.log
          grep -F "EfesOS: generation-based user PID runtime test passed." build/ci-serial.log
          grep -F "EfesOS: scheduler stack resource cleanup passed." build/ci-serial.log
          grep -F "EfesOS: scheduler block/wake lifecycle self-test passed." build/ci-serial.log
          grep -F "EfesOS: user exception isolated." build/ci-serial.log
          grep -F "EfesOS: preemptive scheduler runtime test passed." build/ci-serial.log
          if grep -F "KERNEL PANIC:" build/ci-serial.log; then exit 1; fi
